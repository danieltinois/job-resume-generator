name: e2e

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "scripts/smoke.sh"
      - "profile/profile.example.yaml"
      - "jobs/example.md"
      - ".nvmrc"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "scripts/smoke.sh"
      - "profile/profile.example.yaml"
      - "jobs/example.md"
      - ".nvmrc"
      - ".github/workflows/e2e.yml"

jobs:
  main-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway secret for this run only; the stack is torn down at the end.
      JWT_SECRET: e2e-${{ github.run_id }}-${{ github.run_attempt }}-padding-to-32-bytes
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Smoke test through nginx
        run: SKIP_UP=1 scripts/smoke.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Show the stack logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
