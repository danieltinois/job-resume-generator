[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-tailor"
version = "0.1.0"
description = "Tailored resumes from a single profile, rendered with Typst"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
resume-tailor = "resume_tailor.cli:main"

[tool.setuptools]
packages = ["resume_tailor"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
