# Serves the Angular app and proxies the API, so the browser sees a single
# origin: the refresh cookie stays SameSite=Strict and no CORS is needed.
# The public port is the one in the browser's Host header (compose maps
# 4200 to this container's 80); without one, the scheme's default.
map $scheme $default_port {
    https   443;
    default 80;
}
map $http_host $public_port {
    "~:(?<port>[0-9]+)$" $port;
    default              $default_port;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Largest legitimate request: a profile document or a profile.yaml import.
    client_max_body_size 1m;

    # Inherited by every location below only because none of them uses
    # add_header itself (nginx then drops all of these): caching is set with
    # expires instead.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Scripts only from this origin (the build inlines no script: inlineCritical
    # is off in angular.json). Inline styles stay allowed: Angular and Swagger
    # UI inject them at runtime. blob: frames show the PDF preview.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # nginx is the edge: the client address is the connection's, never a
    # client-sent X-Forwarded-For (that would let anyone pick the address the
    # login rate limit counts). Host and port are the public ones, so the
    # backend builds URLs for the address the browser used.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $public_port;

    location ~ ^/(api|oauth2|login/oauth2|v3/api-docs|swagger-ui)(/|$) {
        proxy_pass http://backend:8080;
        # PDF rendering can take a few seconds under load.
        proxy_read_timeout 60s;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
    }

    # Bundles with a content hash in the name never change: cache them for a
    # year. Unhashed files (favicon.ico, index.html) are revalidated.
    location ~ "-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|ttf)$" {
        expires 1y;
        try_files $uri =404;
    }

    # Every other path is a static file or a client-side route.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
